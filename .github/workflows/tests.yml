name: Reproduce and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.12.23"
      - name: Install locked environment
        run: uv sync --frozen --extra dev --extra motion
      - name: Fetch and verify the small official sources
        run: uv run --frozen pitching fetch
      - name: Check code and deployment dependency export
        run: |
          uv run --frozen ruff check src tests scripts app.py streamlit_app.py
          uv run --frozen ruff format --check src tests scripts app.py streamlit_app.py
          uv run --frozen python scripts/export_requirements.py --check
      - name: Run tests, including cached real-data workflow
        run: uv run --frozen pytest -q
